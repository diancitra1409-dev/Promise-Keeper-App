<!DOCTYPE html>
<html>

<head>
  <title>Register - Promise Keeper</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      

      <h1>Promise Keeper</h1>

      <p class="auth-subtitle">
  Track goals, monitor progress, and achieve every promise.
</p>

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="registerBtn">
        Create Account
      </button>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">
          Login
        </a>
      </p>

    </div>

  </div>

  <script type="module" src="register.js"></script>

</body>
</html>
