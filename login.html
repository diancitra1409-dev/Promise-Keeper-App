<!DOCTYPE html>
<html>

<head>
  <title>Login - Promise Keeper</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <h1>Promise Keeper </h1>

      <p class="auth-subtitle">
        Keep every promise you make.
      </p>

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="loginBtn">
        Login
      </button>

      <p class="auth-footer">
        Don't have an account?
        <a href="register.html">
          Register
        </a>
      </p>

    </div>

  </div>

  <script type="module" src="login.js"></script>

</body>
</html>
