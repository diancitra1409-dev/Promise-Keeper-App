<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Keeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Promise Keeper</h1>

        <div class="form-container">
            <input type="text" id="title" placeholder="Promise Title">

            <textarea
                id="description"
                placeholder="Description"
            ></textarea>

            <input type="date" id="deadline">

            <button id="addBtn">
                Add Promise
            </button>
        </div>

        <div id="promiseList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
